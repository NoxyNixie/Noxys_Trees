[mod-setting-description]
Noxys_Trees-tree_dying_factor=Andel träd som ska tas bort efter att de har brunnit.\nGrundspelets standardvärde är 0.8 (80 %).\n\nAnge 0 för att inte ändra detta beteende.
Noxys_Trees-tree_fire_spread_speed_factor=Multiplikator för hur snabbt skogsbränder sprider sig.
Noxys_Trees-emission_multiplier=Multiplikator för hur mycket föroreningar träden tar upp. Var försiktig! Avvik inte för mycket från 1 – effekterna verkar vara exponentiella.
Noxys_Trees-collision_multiplier=Multiplikator för att justera trädens kollisioner. Lägre värden innebär mindre kollisionsrutor.
Noxys_Trees-enabled=När detta är aktiverat sprider sig träden och dör.
Noxys_Trees-debug=Aktiverar utskrift av felsökningsmeddelanden.
Noxys_Trees-debug-interval=Intervallet i tick mellan felsökningsmeddelanden.
Noxys_Trees-degrade-tiles=Bryter långsamt ned golvplattor som hindrar trädtillväxt tills träd kan växa där igen.
Noxys_Trees-do-not-degrade-reinforced-tiles=Bryt inte ned vissa ”förstärkta” golvplattor. För närvarande är det bara armerad betong som inte bryts ned när detta alternativ är aktiverat.
Noxys_Trees-overpopulation-kills-trees=Om ett kartblock är överbefolkat dör slumpmässigt utvalda träd i det långsamt bort.
Noxys_Trees-kill-trees-near-unwanted=Dödar slumpmässigt träd nära bitarbaser, uranmalm eller spelarens objekt. Detta påverkar även träddöd på grund av låg bördighet eller för mycket föroreningar.
Noxys_Trees-ticks-between-operations=Ger detaljerad kontroll över moddens prestanda och hur snabbt träden sprider sig.
Noxys_Trees-chunks-per-operation=Ger detaljerad kontroll över moddens prestanda och hur snabbt träden sprider sig.
Noxys_Trees-minimum-distance-between-tree=Minsta avstånd mellan träd för att träd ska kunna växa.
Noxys_Trees-minimum-distance-to-enemies=Minsta avstånd till fiendebaser eller maskar för att träd ska kunna växa.
Noxys_Trees-minimum-distance-to-uranium=Minsta avstånd till uranmalm för att träd ska kunna växa.
Noxys_Trees-minimum-distance-to-player-entities=Minsta avstånd till spelarens objekt för att träd ska kunna växa.\n\nAnge 0 för att hoppa över kontrollen och därmed förbättra prestandan något.
Noxys_Trees-minimum-distance-to-degradeable-tiles=Minsta avstånd till markplattor som räknas som nedbrytbara, oavsett om nedbrytning är aktiverad. Ange 0 för att inaktivera kontrollen.\n\nVARNING: Detta alternativ påverkar prestandan mer än de andra alternativen för minsta avstånd och kan orsaka återkommande fördröjningar, särskilt vid högre värden.
Noxys_Trees-deaths-by-lack-of-fertility-minimum=Om markens bördighet är lägre än detta värde finns en risk att trädet på den dör.
Noxys_Trees-deaths-by-pollution-bias=Hur snabbt träd dör av föroreningar.\n\nAnge 0 för att inaktivera träddöd från föroreningar.\n\nAntal ytterligare träd som systemet försöker döda = math.ceil(pollution / this).
Noxys_Trees-trees-to-grow-per-chunk-percentage=Ger detaljerad kontroll över moddens prestanda och hur snabbt träden sprider sig.\n\nVarje kartblock försöker skapa minst ett träd, men andelen kan öka antalet utifrån hur många träd som redan finns i blocket.\n\nOm andelen är 0.01 (1 %) och kartblocket har 200 träd försöker det skapa 2 ytterligare träd per åtgärd.
Noxys_Trees-maximum-trees-per-chunk=Om ett kartblock har fler träd än detta antal sprids inga nya träd i blocket.\n(Grundspelets täta skogar verkar ha omkring 512 träd per kartblock.)
Noxys_Trees-expansion-distance=Hur långt från ursprungsträdet, räknat i rutor, ett nytt träd kan skapas.
Noxys_Trees-surfaces=En kommaseparerad lista över alla ytor där trädmodden ska vara aktiv.\n\nStandardvärdet är enbart '1', vilket är 'Nauvis'.
Noxys_Trees-trees-grow-on-landfill=När detta är aktiverat växer träd på utfylld mark.


